# Sized for a low-RAM Windows host. The Flutter template default (-Xmx8G) made
# the Gradle daemon abort with "insufficient memory" on a 7 GB machine.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental cache cannot relativize plugin sources (C:) against
# this project (E:) on Windows, which breaks builds. Disable it.
kotlin.incremental=false
