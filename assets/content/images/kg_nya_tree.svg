<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="90" fill="#E8F8F5"/>
  <!-- Banyan / Shade Tree (ညောင်ပင်) -->
  <!-- Ground -->
  <ellipse cx="100" cy="168" rx="60" ry="12" fill="#C8E6C9"/>
  <!-- Tree Trunk -->
  <path d="M86,170 C92,130 84,115 90,95 L110,95 C116,115 108,130 114,170 Z" fill="#795548"/>
  <!-- Aerial roots -->
  <line x1="82" y1="125" x2="80" y2="165" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="125" x2="120" y2="165" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lush Green Foliage Canopy -->
  <circle cx="70" cy="85" r="32" fill="#4CAF50"/>
  <circle cx="130" cy="85" r="32" fill="#4CAF50"/>
  <circle cx="100" cy="65" r="38" fill="#66BB6A"/>
  <circle cx="75" cy="60" r="25" fill="#81C784"/>
  <circle cx="125" cy="60" r="25" fill="#81C784"/>
  <!-- Little Birds in Tree -->
  <circle cx="75" cy="50" r="4" fill="#FFC107"/>
  <polygon points="79,50 84,52 79,54" fill="#FF9800"/>
  <!-- Letter Badge ည -->
  <circle cx="45" cy="45" r="22" fill="#00897B"/>
  <text x="45" y="54" font-family="'NotoSansMyanmar', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ည</text>
</svg>