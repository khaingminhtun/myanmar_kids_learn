  <circle cx="45" cy="45" r="22" fill="#D32F2F"/>
  <text x="45" y="54" font-family="'NotoSansMyanmar', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ဈ</text>
