  <polygon points="130,72 120,50 110,70" fill="#6D4C41"/>
  <!-- Big Owl Eyes -->
  <circle cx="82" cy="90" r="18" fill="#FFF"/>
  <circle cx="118" cy="90" r="18" fill="#FFF"/>
  <circle cx="82" cy="90" r="10" fill="#FBC02D"/>
  <circle cx="118" cy="90" r="10" fill="#FBC02D"/>
  <circle cx="82" cy="90" r="6" fill="#212121"/>
  <circle cx="118" cy="90" r="6" fill="#212121"/>
  <circle cx="84" cy="88" r="2" fill="#FFF"/>
  <circle cx="120" cy="88" r="2" fill="#FFF"/>
  <!-- Beak -->
  <polygon points="95,102 105,102 100,114" fill="#FF9800"/>
  <!-- Claws on branch -->
  <circle cx="90" cy="155" r="4" fill="#FFA000"/>
  <circle cx="96" cy="156" r="4" fill="#FFA000"/>
  <circle cx="104" cy="156" r="4" fill="#FFA000"/>
  <circle cx="110" cy="155" r="4" fill="#FFA000"/>
