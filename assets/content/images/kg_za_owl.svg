  <circle cx="45" cy="45" r="22" fill="#5E35B1"/>
  <text x="45" y="54" font-family="'NotoSansMyanmar', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ဇ</text>
